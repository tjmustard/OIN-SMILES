[project]
name = "oin-smiles"
version = "0.3.0"
description = "OIN-SMILES: A Python library for generating OIN-SMILES from molecular structures"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ase>=3.26.0",
    "mendeleev>=1.1.0",
    "networkx>=3.4.2",
    "numba>=0.62.1",
    "numpy>=2.2.6",
    "openbabel-wheel>=3.1.1.22",
    "pulp>=3.3.2",
    "rdkit>=2025.9.3",
    "scine-molassembler>=2.0.0",
    "scipy>=1.15.3",
    "xtb>=22.1",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]

[project.scripts]
oin-smiles = "oinsmiles.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oinsmiles"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
# Test/diagnostic scripts: docstrings not required; standalone scripts do sys.path
# setup before imports (E402) and carry long diagnostic/data lines (E501).
"tests/**" = ["D", "E402", "E501"]
# HACF toolchain scripts (not part of the OIN-SMILES public API): same rationale as
# tests/** above, plus version-guard imports (import sys; check sys.version_info)
# that must run before other imports, which trips E402.
".agents/scripts/**" = ["D", "E402", "E501"]
# Vendored xyz2mol algorithm (Jensen et al.); keep upstream docstring style.
"src/oinsmiles/utils/xyz2mol_local.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["oinsmiles"]

[tool.ruff.format]
quote-style = "double"
