[project]
name = "oin-smiles"
version = "0.2.0"
description = "OIN-SMILES: A Python library for generating OIN-SMILES from molecular structures"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "ase>=3.26.0",
    "mendeleev>=1.0.0,<1.1.0",
    "networkx>=3.4.2",
    "numba>=0.62.1",
    "numpy<2.0",
    "openbabel-wheel>=3.1.1.22",
    "rdkit>=2025.9.3",
    "scine-molassembler>=3.0.0",
    "scipy>=1.15.3",
    "setuptools>=82.0.0",
    "xtb>=22.1", # Installs bindings only. Binary must be installed separately.
]

[project.scripts]
oin-smiles = "oinsmiles.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
