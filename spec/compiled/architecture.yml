    depends_on: []
    implements:
    - mod_generation
- id: atom_ParsedOIN
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/generation/oin_parser.py
  description: 'Dataclass: smiles (str), fragments (List[str]), metal_fragment_idx
