- id: atom_cip_assigner
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/core/chirality.py
  description: 'CIPAssigner: Assigns CIP (R/S) codes to chiral P/N atoms before fragmentation
    (metal-present convention, _OIN_CIPCode); Stereo Phase 4 additionally assigns
    the fragment-local (lone-pair convention) _OIN_CIPCode_LP on each Zone-A P bonded
    to exactly one metal, via a dummy-metal copy computed while 3D is present'
  inputs:
  - data_type: mol_with_conformer
    source_id: atom_xyz2mol
  outputs:
  - data_type: mol_with_cip_codes
    target_id: atom_oin_aligner
  edges:
    depends_on: []
    implements: []
- id: atom_chirality_recovery
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/core/chirality.py
  description: 'ChiralityRecoveryUtility: Re-applies @/@@ chiral tags post-sanitization
    using stored CIP codes; Stereo Phase 4: a Zone-A P carrying _OIN_CIPCode_LP is
    kept and verify-and-flipped (never cleared), checked before the degree-keyed branches;
    Zone-A P/N without the property, and all N, keep the prior clearing behaviour
    (PseudoAtomStrategy scaffolding removed, behaviour retained). Stereo Phase 4
    MiniPRD-C also adds a standalone helper in this file, _attach_dummy_metal(mol,
    p_idx) (called from molassembler_adapter._stitch_fragment, not part of
    ChiralityRecoveryUtility): appends a Z=0 wildcard as a metal-free Zone-A P atom''s
    4th substituent before ETKDG embedding so its [P@]/[P@@] tag controls a true
    4-coordinate tetrahedron; mirrors, but never calls, _build_dummy_metal_copy''s
    valence-bookkeeping fix'
  inputs:
  - data_type: mol_with_cip_codes
    source_id: atom_oin_sanitizer
  outputs:
  - data_type: mol_with_stereo
    target_id: atom_oin_inline_handler
  edges:
    depends_on: []
    implements: []
