nodes:
- id: sys_oin_smiles
  dimension: System
  status: clean
  associated_file: spec/compiled/SuperPRD.md
  description: >-
    OIN-SMILES library — a SMILES extension that encodes Transition Metal Complex
    (TMC) stereochemistry via inline slot-assignment tags. Provides two end-to-end
    pipelines: XYZ→OIN-SMILES (lossless encoding with CIP stereo) and OIN-SMILES→XYZ
    (deterministic 3D reconstruction via SCINE Molassembler with RDKit ETKDG fallback).
    Accessible via Python API (XYZToSMILES, OIN3DGenerator) and shell CLI
    (oin-smiles xyz2oin / oin2xyz). Validated by a chiral test suite covering 6 regression
    complexes, BINAP stability, P/N-chiral CIP oracle checks, and axial-chirality
    placeholder tests (43 passing, 1 intentional skip).
  inputs:
  - data_type: XYZ file path
    source_id: external_user
  - data_type: OIN-SMILES string
    source_id: external_user
  outputs:
  - data_type: OIN-SMILES string (V3.6 inline)
    target_id: external_user
  - data_type: XYZ block string (3D conformer)
    target_id: external_user
  edges:
    depends_on: []
    implements: []
- id: mod_api
  dimension: Module
  status: clean
  associated_file: src/oinsmiles/__init__.py
  description: "Public package entry point. Re-exports XYZToSMILES and SMILESToXYZ\
    \ from core.translator as the library's stable Python API surface. Also contains\
    \ cli.py which registers the oin-smiles CLI entry point (xyz2oin / oin2xyz subcommands)\
    \ \u2014 CLI delegates entirely to XYZToSMILES and OIN3DGenerator; no logic in\
    \ cli.py.\n"
  inputs:
  - data_type: import request
    source_id: external_user
  - data_type: CLI invocation (oin-smiles xyz2oin / oin2xyz)
    source_id: external_user
  outputs:
  - data_type: XYZToSMILES class
    target_id: external_user
  - data_type: SMILESToXYZ class
    target_id: external_user
  - data_type: OIN-SMILES string (stdout, via CLI)
    target_id: external_user
  - data_type: XYZ block string (stdout, via CLI)
    target_id: external_user
  edges:
    depends_on:
    - mod_core
    - mod_generation
    implements:
    - sys_oin_smiles
- id: mod_core
  dimension: Module
  status: dirty
  associated_file: src/oinsmiles/core/
  description: 'Core data model and public translator classes. Contains TMCGraph/Atom/BondType
    graph primitives and the XYZToSMILES / SMILESToXYZ translator facade. TD-001 (duplicate
    convert method) and TD-003 (incomplete SMILESToXYZ) live here.

    '
  inputs:
  - data_type: XYZ file path
    source_id: mod_api
  - data_type: OIN-SMILES string
    source_id: mod_api
  outputs:
  - data_type: OIN-SMILES string
    target_id: mod_api
  - data_type: TMCGraph
    target_id: mod_api
  edges:
    depends_on:
    - mod_oin
    - mod_utils
    implements:
    - sys_oin_smiles
- id: mod_oin
  dimension: Module
  status: dirty
  associated_file: src/oinsmiles/oin/
  description: 'OIN format handling layer. Contains sidecar parser (OINParser), legacy
    V1.x writer (OINWriter), and experimental V3.0 inline format handler (OINInlineHandler).
    TD-002 (broken generate_inline_string) and TD-010 (dead _parse_tags) live here.

    '
  inputs:
  - data_type: OIN-SMILES string (any version)
    source_id: mod_core
  - data_type: V2.4 sidecar OIN string
    source_id: mod_utils
  outputs:
  - data_type: parsed SMILES + tag dict
    target_id: mod_core
  - data_type: V3.0 inline OIN string
    target_id: mod_utils
  edges:
    depends_on: []
    implements:
    - sys_oin_smiles
- id: mod_generation
  dimension: Module
  status: clean
  associated_file: src/oinsmiles/generation/
  description: "OIN-SMILES\u2192XYZ 3D generation pipeline. Orchestrates parsing (OINParser_gen)\
    \ and 3D conformer generation (MolassemblerAdapter). Architector backend removed;\
    \ SCINE Molassembler is now the sole backend, executing in a separate OS process\
    \ via ProcessPoolExecutor. RDKit ETKDG fallback used when Molassembler DG returns\
    \ Error.GraphImpossible (e.g. OCT bidentate complexes).\n"
  inputs:
  - data_type: OIN-SMILES string
    source_id: mod_api
  outputs:
  - data_type: XYZ block string (3D conformer)
    target_id: external_user
  edges:
    depends_on:
    - mod_oin
    implements:
    - sys_oin_smiles
- id: mod_utils
  dimension: Module
  status: clean
  associated_file: src/oinsmiles/utils/
  description: "Core algorithmic utilities. Contains the XYZ\u2192adjacency matrix\
    \ pipeline (xyz2mol, xyz2mol_local) and the OIN encoding engine (OINSanitizer,\
    \ OINDiscreteAligner). This is where the active XYZ\u2192OIN pipeline lives.\n"
  inputs:
  - data_type: XYZ file path
    source_id: mod_core
  - data_type: RDKit Mol + xyz_coords
    source_id: atom_get_tmc_mol
  outputs:
  - data_type: OIN-SMILES string (V3.6 inline)
    target_id: mod_core
  edges:
    depends_on: []
    implements:
    - sys_oin_smiles
