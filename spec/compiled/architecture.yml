- id: atom_OINInlineHandler
  dimension: Atomic
  status: dirty
  associated_file: src/oinsmiles/oin/inline.py
  description: "V3.0 inline OIN format handler. Constants: METAL_REGEX, SLOT_REGEX.\
    \ parse_inline_string(): functional \u2014 converts [Metal_GEO].Lig{Slot} \u2192\
    \ (smiles, geo, vector_data). generate_inline_string(): TD-002 \u2014 body is\
    \ a pass stub; docstring and implementation code are unreachable dead code. Active\
    \ inline generation lives in utils/xyz2mol.py:get_oin_string(). Uses RDKit atom\
    \ map numbers internally.\n"
  inputs:
  - data_type: V3.0 inline OIN string
    source_id: atom_OINParser_oin
  - data_type: V3.0 inline OIN string
    source_id: atom_OINParser_gen
  outputs:
  - data_type: tuple(smiles_str, geo_code, List[Tuple[rank,atom_idx,slot]])
