system:
  id: sys_oin_smiles
  dimension: System
  description: "OIN-SMILES: Lossless XYZ \u2194 OIN/SMILES conversion for Transition\
    \ Metal Complexes"
  status: clean
nodes:
- id: mod_api
  dimension: Module
  status: clean
