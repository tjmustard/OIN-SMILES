  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/generation/oin_parser.py
  description: 'Dataclass: atom_idx (int, -1 in generation path), vector (Tuple[float,float,float]
    resolved from TEMPLATES), fragment_idx (int), atom_in_fragment_idx (int).

    '
  inputs: []
  outputs:
  - data_type: OINVector instance
    target_id: atom_OINParser_gen
