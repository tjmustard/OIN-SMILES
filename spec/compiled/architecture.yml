system:
  id: sys_oin_smiles
  dimension: System
  description: "OIN-SMILES: Lossless XYZ \u2194 OIN/SMILES conversion for Transition\
    \ Metal Complexes"
  status: clean
nodes:
- id: mod_api
  dimension: Module
  status: clean
  associated_file: src/oinsmiles/__init__.py
  description: Public API exports (XYZToSMILES, SMILESToXYZ)
  inputs:
  - data_type: module_imports
    source_id: mod_core
  outputs:
  - data_type: api_interface
    target_id: user_code
  edges:
    depends_on:
    - mod_core
    implements:
    - atom_api_exports
- id: mod_core
  dimension: Module
  status: clean
  associated_file: src/oinsmiles/core/
  description: 'Core translation logic: graph generation, chirality handling, main
    conversion APIs'
  inputs:
  - data_type: xyz_file
    source_id: user_code
  - data_type: oin_string
    source_id: mod_generation
  outputs:
  - data_type: oin_string
    target_id: mod_oin
  - data_type: 3d_structure
    target_id: mod_generation
  edges:
    depends_on:
    - mod_oin
    - mod_utils
    implements:
    - atom_xyz_to_smiles
    - atom_smiles_to_xyz
    - atom_cip_assigner
    - atom_chirality_recovery
    - atom_tmc_graph
    - atom_clear_chelate_locked_bond_stereo
- id: mod_generation
  dimension: Module
  status: clean
  associated_file: src/oinsmiles/generation/
  description: '3D structure generation from OIN via the MetalloGen engine (generator3d/
    dummy-metal CoordMap embedding, PuLP bond-order/charge resolution, g-xTB/MACE
    optimization, see mod_generator3d), wrapped by OIN3DGenerator. The legacy
    Molassembler backend was removed once MetalloGen became the sole engine.'
  inputs:
  - data_type: oin_string
    source_id: mod_oin
  - data_type: timeout_seconds
    source_id: user_code
  outputs:
  - data_type: generated_structure
    target_id: user_code
  edges:
    depends_on:
    - mod_oin
    - mod_core
    - mod_utils
    - mod_generator3d
    implements:
    - atom_oin3d_generator
    - atom_oin_parser_gen
    - atom_metallogen_adapter
- id: mod_oin
  dimension: Module
  status: clean
  associated_file: src/oinsmiles/oin/
  description: 'OIN format handling: parsing, writing, inline v3.6 format serialization'
  inputs:
  - data_type: mol_object
    source_id: mod_utils
  - data_type: geometry_vector
    source_id: mod_core
  outputs:
  - data_type: oin_string
    target_id: mod_generation
  - data_type: parsed_oin
    target_id: mod_core
  edges:
    depends_on: []
    implements:
    - atom_oin_inline_handler
    - atom_oin_parser_oin
    - atom_oin_writer
    - atom_oin_compare
- id: mod_utils
  dimension: Module
  status: clean
  associated_file: src/oinsmiles/utils/
  description: Graph generation (Jensen algorithm), geometry alignment, sanitization
  inputs:
  - data_type: xyz_file
    source_id: mod_core
  - data_type: oin_geometry
    source_id: mod_oin
  outputs:
  - data_type: tmc_mol
    target_id: mod_core
  - data_type: aligned_geometry
    target_id: mod_oin
  edges:
    depends_on: []
    implements:
    - atom_xyz2mol
    - atom_oin_aligner
    - atom_oin_sanitizer
    - atom_aromaticity
- id: mod_cli
  dimension: Module
  status: clean
  associated_file: src/oinsmiles/cli.py
  description: 'Command-line interface: oin-smiles xyz2oin / oin2xyz commands; fixed
    GeneratedStructure API compatibility in oin2xyz handler'
  inputs:
  - data_type: cli_arguments
    source_id: user_code
  outputs:
  - data_type: stdout
    target_id: user_code
  edges:
    depends_on:
    - mod_api
    implements:
    - atom_cli_main
- id: atom_api_exports
  dimension: Atomic
  status: needs_review
  associated_file: src/oinsmiles/__init__.py
  description: Re-exports three public API items from core modules; XYZToSMILES and
    SMILESToXYZ classes from core.translator, plus OINStereoWarning exception from
    core.chirality
  inputs:
  - data_type: module_imports
    source_id: mod_core
  outputs:
  - data_type: api_classes
    target_id: user_code
  edges:
    depends_on:
    - atom_xyz_to_smiles
    - atom_smiles_to_xyz
    - atom_cip_assigner
    implements: []
- id: atom_xyz_to_smiles
  dimension: Atomic
  status: dirty
  associated_file: src/oinsmiles/core/translator.py
  description: 'XYZToSMILES.convert(): Reads XYZ file path, calls get_tmc_mol() to
    generate 3D conformer, sanitizes with RDKit, assigns CIP codes to P/N stereocenters,
    then calls get_oin_string() to perform fragmentation, geometry detection via OINDiscreteAligner,
    and serialization to OIN v3.6 inline format'
  inputs:
  - data_type: xyz_file_path
    source_id: user_code
  outputs:
  - data_type: oin_string
    target_id: user_code
  edges:
    depends_on:
    - atom_xyz2mol
    - atom_cip_assigner
    - atom_chirality_recovery
    - atom_oin_aligner
    - atom_oin_sanitizer
    - atom_oin_inline_handler
    - atom_clear_chelate_locked_bond_stereo
    implements: []
- id: atom_smiles_to_xyz
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/core/translator.py
  description: 'SMILESToXYZ.convert(): Incomplete stub that parses OIN string with
    legacy OINParser and returns placeholder TMCGraph with dummy atoms; actual 3D
    coordinate generation not implemented (should delegate to OIN3DGenerator)'
  inputs:
  - data_type: oin_string
    source_id: user_code
  outputs:
  - data_type: tmc_graph
    target_id: user_code
  edges:
    depends_on:
    - atom_oin_parser_oin
    implements: []
- id: atom_cip_assigner
  dimension: Atomic
  status: dirty
  associated_file: src/oinsmiles/core/chirality.py
  description: 'CIPAssigner: Assigns CIP (R/S) codes to chiral P/N atoms before fragmentation
    (metal-present convention, _OIN_CIPCode); Stereo Phase 4 additionally assigns
    the fragment-local (lone-pair convention) _OIN_CIPCode_LP on each Zone-A P bonded
    to exactly one metal, via a dummy-metal copy computed while 3D is present. R5
    (v0.3.7): _reparse_aromatic_cip_label(mol, idx) re-parses a mol from SMILES with
    kekulization skipped and re-runs rdCIPLabeler.AssignCIPLabels to get a stable
    R/S label for a stereocentre adjacent to an aromatic haptic ring (Cp/indenyl/fluorenyl),
    since raw rdCIPLabeler flips sign depending on aromatic-vs-kekulized bond state;
    the resulting label is stamped as _OIN_CIPCode_SP3 (by build_contract_mol/_template_sp3_label
    in generation/metallogen_adapter.py) for sp3 stereocenters'
  inputs:
  - data_type: mol_with_conformer
    source_id: atom_xyz2mol
  outputs:
  - data_type: mol_with_cip_codes
    target_id: atom_oin_aligner
  edges:
    depends_on: []
    implements: []
- id: atom_chirality_recovery
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/core/chirality.py
  description: 'ChiralityRecoveryUtility: Re-applies @/@@ chiral tags post-sanitization
    using stored CIP codes; Stereo Phase 4: a Zone-A P carrying _OIN_CIPCode_LP is
    kept and verify-and-flipped (never cleared), checked before the degree-keyed branches;
    Zone-A P/N without the property, and all N, keep the prior clearing behaviour
    (PseudoAtomStrategy scaffolding removed, behaviour retained).
    R5 (v0.3.7): recover() also reads back the _OIN_CIPCode_SP3 property (stamped
    by generation/metallogen_adapter.py''s build_contract_mol) to orient sp3 stereocenters
    adjacent to aromatic haptic rings correctly on the MetalloGen decode path'
  inputs:
  - data_type: mol_with_cip_codes
    source_id: atom_oin_sanitizer
  outputs:
  - data_type: mol_with_stereo
    target_id: atom_oin_inline_handler
  edges:
    depends_on: []
    implements: []
- id: atom_tmc_graph
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/core/graph.py
  description: 'TMCGraph: Graph data structure for TMC topology; includes Atom, BondType
    enum'
  inputs:
  - data_type: connectivity_data
    source_id: atom_xyz2mol
  outputs:
  - data_type: graph_object
    target_id: atom_oin_aligner
  edges:
    depends_on: []
    implements: []
- id: atom_oin3d_generator
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/generation/engine.py
  description: 'OIN3DGenerator.__init__(engine="metallogen", optimizer="xtb", ...):
    lazily imports and instantiates MetalloGenAdapter (generator3d dummy-metal CoordMap
    embed + PuLP bond-order resolution + g-xTB/MACE optimization, see mod_generator3d).
    The ``engine`` parameter is retained for backward compatibility and must be
    "metallogen" (the only supported backend); any other value raises ValueError.
    generate() parses the OIN string via OINParser (generation/oin_parser.py, v3.6
    inline format) then delegates to self.adapter.generate(parsed) to produce a
    GeneratedStructure (xyz block + RDKit mol)'
  inputs:
  - data_type: oin_string
    source_id: user_code
  - data_type: timeout_seconds
    source_id: user_code
  outputs:
  - data_type: generated_structure
    target_id: user_code
  edges:
    depends_on:
    - atom_oin_parser_gen
    - atom_metallogen_adapter
    implements: []
- id: atom_generated_structure
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/generation/structure.py
  description: 'GeneratedStructure dataclass: (xyz: str, mol: Optional[Chem.Mol])
    return type for OIN3DGenerator, defined in the lightweight generation/structure.py
    module (relocated from the removed molassembler_adapter.py)'
  inputs:
  - data_type: xyz_block
    source_id: atom_metallogen_adapter
  - data_type: mol_object
    source_id: atom_metallogen_adapter
  outputs:
  - data_type: structure_object
    target_id: user_code
  edges:
    depends_on: []
    implements: []
- id: atom_oin_parser_gen
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/generation/oin_parser.py
  description: "OINParser (generation): Parses OIN strings \u2192 ParsedOIN dataclass\
    \ with geometry, slots, connectivity; handles both v3.6 inline (via\
    \ OINInlineHandler) and v2.4 sidecar formats, resolving slot vectors against the\
    \ TEMPLATES geometry tables"
  inputs:
  - data_type: oin_string
    source_id: atom_oin3d_generator
  outputs:
  - data_type: parsed_oin
    target_id: atom_metallogen_adapter
  edges:
    depends_on: []
    implements: []
- id: atom_oin_inline_handler
  dimension: Atomic
  status: dirty
  associated_file: src/oinsmiles/oin/inline.py
  description: 'OINInlineHandler: Parses/generates OIN v3.6 inline format (e.g. [Pt@SP1_SPL].[Cl]{0}.[Cl]{1}).
    R3 (v0.3.7): a terminal-nitride 0-H bracket branch in the replace_map closure
    emits [N]{slot} instead of bare N{slot} when the mapped atom has GetDegree() ==
    0 (no heavy neighbour), disambiguating a 0-H nitride from a bare-N 3-H ammine'
  inputs:
  - data_type: mol_with_stereo
    source_id: atom_chirality_recovery
  - data_type: geometry_vector
    source_id: atom_oin_aligner
  outputs:
  - data_type: oin_string
    target_id: user_code
  edges:
    depends_on: []
    implements: []
- id: atom_oin_parser_oin
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/oin/parser.py
  description: 'OINParser (oin): Alternative parser returning (str, Dict) tuple; superseded
    by generation/oin_parser in v0.2.0+'
  inputs:
  - data_type: oin_string
    source_id: atom_oin_inline_handler
  outputs:
  - data_type: parsed_tuple
    target_id: atom_smiles_to_xyz
  edges:
    depends_on: []
    implements: []
- id: atom_oin_writer
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/oin/writer.py
  description: 'OINWriter: Writes OIN strings from geometry vectors and metadata'
  inputs:
  - data_type: geometry_data
    source_id: atom_oin_aligner
  outputs:
  - data_type: oin_string
    target_id: atom_oin_inline_handler
  edges:
    depends_on: []
    implements: []
- id: atom_xyz2mol
  dimension: Atomic
  status: dirty
  associated_file: src/oinsmiles/utils/perception_tmc.py
  description: 'perception_tmc (formerly xyz2mol.py): Graph generation from 3D coordinates
    using Jensen Group algorithm; produces RDKit mol with 3D conformer. get_tmc_mol()
    and _repair_mixed_aromaticity() call into the new utils/aromaticity.py (dearomatize_stuck_rings)
    to de-aromatize rings stuck in a kekulization-hostile state before sanitization'
  inputs:
  - data_type: xyz_block
    source_id: user_code
  outputs:
  - data_type: tmc_mol_with_3d
    target_id: atom_cip_assigner
  edges:
    depends_on:
    - atom_aromaticity
    implements: []
- id: oin.winding.signed_circulation
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/oin/winding.py
  description: 'signed_circulation(coords, star_local_idx, axis): single source of
    truth for eta-ring winding sign, shared by encode (_determine_winding) and Stereo
    Phase 3 generation-side haptic-face correction; centers coords on their own centroid
    internally, requires SMILES/fragment order, hosts the n<3 -> ">" default, axis
    convention is metal->centroid outward'
  inputs:
  - data_type: placed_ring_coords
    source_id: atom_oin_aligner
  outputs:
  - data_type: winding_char
    target_id: atom_oin_aligner
  edges:
    depends_on: []
    implements: []
- id: atom_oin_aligner
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/utils/oin_aligner.py
  description: 'OINSanitizer and OINDiscreteAligner: OINSanitizer.generate_robust_smiles()
    forces explicit H on Zone-A atoms to prevent SMILES drift; OINDiscreteAligner
    detects coordination geometry via template matching (LIN/TPL/SPL/TET/TPY/TBP/SPY/OCT/PBP),
    reduces hapticity to virtual atoms, assigns slots, applies maximization + homogeneous
    sorting + heading-atom selection for canonical geometry string, delegating winding
    sign to oin.winding.signed_circulation. Eta-ring canonicalization (2026-07-04,
    MiniPRD_EtaRingCanonicalization): a scoped eta-only rank swap reorders only same-mass,
    content-distinct haptic (eta) fragments among the rank slots they already occupy,
    keyed on heading-independent canonical ring SMILES with winding sense as a content-identical
    tiebreak only (RC1); the heading atom of a substituted/asymmetric eta ring not
    in SYMMETRIC_LIGANDS is chosen by lowest Chem.CanonicalRankAtoms rank instead
    of 3D geometric alignment, both with a fail-safe fallback to the prior geometric
    behavior (RC2). Both fixes are order-invariant, non-eta/metal ranks and the SYMMETRIC_LIGANDS
    path are untouched by construction, and neither touches winding-sign computation.'
  inputs:
  - data_type: mol_with_cip_codes
    source_id: atom_cip_assigner
  - data_type: ligand_data_dict
    source_id: atom_xyz2mol
  outputs:
  - data_type: canonical_geometry_string
    target_id: atom_oin_writer
  - data_type: aligned_coordinates
    target_id: atom_oin_writer
  edges:
    depends_on:
    - oin.winding.signed_circulation
    implements: []
- id: atom_oin_sanitizer
  dimension: Atomic
  status: dirty
  associated_file: src/oinsmiles/utils/oin_aligner.py
  description: 'OINSanitizer: RDKit sanitization with property preservation; generates
    robust SMILES from fragments. R4 (v0.3.7): generate_robust_smiles() charges the
    shell on a NON-binding chalcogen donor (e.g. a croconate/oxo ring O, a nitrito
    -O) that carries a genuine valence deficit -- a valence-1 O becomes [O-] via SetFormalCharge(-deficit)
    rather than a radical -- disambiguating a true 0-H chalcogen from an aqua/hydroxo/carbonyl/ether
    O sitting at full valence'
  inputs:
  - data_type: aligned_geometry
    source_id: atom_oin_aligner
  outputs:
  - data_type: mol_with_properties
    target_id: atom_chirality_recovery
  - data_type: fragment_smiles
    target_id: atom_oin_inline_handler
  edges:
    depends_on: []
    implements: []
- id: atom_cli_main
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/cli.py
  description: 'main() entry point and subcommand dispatchers: Creates argparse parser
    for ''oin-smiles'' command; dispatches xyz2oin subcommand via _cmd_xyz2oin (calls
    XYZToSMILES().convert(), prints OIN string) or oin2xyz subcommand via _cmd_oin2xyz
    (calls OIN3DGenerator(optimizer=args.optimizer).generate(args.oin), prints
    result.xyz); oin2xyz exposes a single --optimizer flag (geometry optimizer for
    the MetalloGen engine); handles errors and exit codes'
  inputs:
  - data_type: sys_argv
    source_id: user_code
  outputs:
  - data_type: stdout_oin_or_xyz
    target_id: user_code
  edges:
    depends_on:
    - atom_xyz_to_smiles
    - atom_oin3d_generator
    implements: []
- id: mod_generator3d
  dimension: Module
  status: clean
  associated_file: src/oinsmiles/generator3d/
  description: 'MetalloGen 3D structure generation engine (new package, added v0.3.4/v0.3.5):
    dummy-metal + RDKit CoordMap distance-geometry embedding, PuLP/ILP bond-order
    and formal-charge resolution, constrained MMFF/UFF geometry cleanup, and ASE-based
    geometry refinement (g-xTB subprocess / MACE-omol25). Instantiated by generation/metallogen_adapter.py
    as the default OIN3DGenerator backend'
  inputs:
  - data_type: msmiles_string
    source_id: atom_metallogen_adapter
  outputs:
  - data_type: xyz_positions
    target_id: atom_metallogen_adapter
  - data_type: rdkit_mol
    target_id: atom_metallogen_adapter
  edges:
    depends_on:
    - mod_utils
    implements:
    - atom_metallogen_generate_3d
    - atom_metallogen_om
    - atom_metallogen_embed
    - atom_metallogen_clean_geometry
    - atom_metallogen_chem
    - atom_metallogen_process
    - atom_metallogen_ligand
    - atom_compute_chg_and_bo_pulp
    - atom_ml_optimizer
- id: atom_metallogen_generate_3d
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/generator3d/__init__.py
  description: 'generate_3d_structures(): top-level MetalloGen orchestrator -- embed
    candidate conformers, run TMCOptimizer force-field cleanup, filter/dedupe by stereo
    and heavy-atom RMSD (calculate_heavy_atom_rmsd), then optionally hand off to ASEOptimizer
