    an XYZ block'
  inputs:
  - data_type: metal_complex
    source_id: atom_metallogen_om
  outputs:
  - data_type: xyz_string
    target_id: atom_metallogen_adapter
  edges:
    depends_on:
    - atom_metallogen_om
    - atom_metallogen_embed
    - atom_metallogen_clean_geometry
    - atom_ml_optimizer
    implements: []
- id: atom_metallogen_om
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/generator3d/om.py
  description: Geometry and MetalComplex (center atom + ligand list + adjacency/bond-order
    matrices) data classes; construct_metal_complex() builds a MetalComplex; get_om_from_modified_smiles()
    parses an m-SMILES string into a MetalComplex
  inputs:
  - data_type: msmiles_string
    source_id: atom_metallogen_adapter
  outputs:
  - data_type: metal_complex
    target_id: atom_metallogen_generate_3d
  edges:
