    target_id: atom_OIN3DGenerator
  edges:
    depends_on:
    - atom_OINParser_gen
    implements:
    - mod_generation
- id: atom_ArchitectorWrapper
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/generation/wrapper.py
  description: 'Calls architector.build_complex() with constructed inputDict. run()
    builds inputDict from metal/ligands/parameters, calls build_complex, returns the
    first conformer. Handles optional debug JSON dump. Raises ImportError if architector
    not installed; raises ValueError if no conformers generated. Marked for DEPRECATION
    per Draft PRD (Molassembler replacement).

    '
  inputs:
  - data_type: Dict (metal, ligands, parameters)
    source_id: atom_OIN3DGenerator
  outputs:
  - data_type: Architector conformer object
    target_id: atom_OIN3DGenerator
  edges:
    depends_on: []
    implements:
    - mod_generation
- id: atom_get_tmc_mol
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/utils/xyz2mol.py
  description: "Entry point for XYZ\u2192RDKit Mol conversion. Reads XYZ file, generates\
    \ adjacency matrix via xyz2AC_huckel (primary) / xyz2AC_obabel (fallback), calls\
    \ AC2mol, applies lig_checks. Accepts with_stereo flag. Returns (RDKit Mol, xyz_coords\
    \ dict).\n"
  inputs:
  - data_type: XYZ file path, charge, with_stereo flag
    source_id: atom_XYZToSMILES
  outputs:
  - data_type: tuple(RDKit Mol, xyz_coords dict)
    target_id: atom_get_oin_string
  edges:
    depends_on:
    - atom_xyz2AC_huckel
    - atom_xyz2AC_obabel
    - atom_AC2mol
    - atom_lig_checks
    - atom_get_basic_mol
    - atom_get_lig_mol
    - atom_OINSanitizer
    implements:
    - mod_utils
- id: atom_get_oin_string
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/utils/xyz2mol.py
  description: 'Generates the canonical V3.6 OIN-SMILES inline string from a TMC RDKit
    Mol and 3D coordinates. Calls OINDiscreteAligner for geometry detection and slot
    assignment, then serializes via OINInlineHandler (active path: get_oin_string()
    builds inline directly, bypassing the broken OINInlineHandler.generate_inline_string()).

    '
  inputs:
  - data_type: RDKit Mol, xyz_coords dict
    source_id: atom_get_tmc_mol
  outputs:
  - data_type: OIN-SMILES string (V3.6 inline)
    target_id: atom_XYZToSMILES
  edges:
    depends_on:
    - atom_OINSanitizer
    - atom_OINDiscreteAligner
    implements:
    - mod_utils
- id: atom_get_basic_mol
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/utils/xyz2mol.py
  description: 'Gets a basic unsanitized RDKit Mol from an adjacency matrix (AC) and
    atom symbols. Wraps AC2mol for the initial connectivity step in the pipeline.

    '
  inputs:
  - data_type: adjacency matrix, atom symbols, charge
    source_id: atom_get_tmc_mol
  outputs:
  - data_type: RDKit Mol (unsanitized)
    target_id: atom_get_tmc_mol
  edges:
    depends_on:
    - atom_AC2mol
    implements:
    - mod_utils
- id: atom_get_lig_mol
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/utils/xyz2mol.py
  description: 'Extracts a ligand fragment RDKit Mol from the full TMC Mol. Used to
    validate and clean individual ligand SMILES before OIN encoding.

    '
  inputs:
  - data_type: RDKit Mol, ligand atom indices
    source_id: atom_get_tmc_mol
  outputs:
  - data_type: RDKit Mol (ligand fragment)
    target_id: atom_get_tmc_mol
  edges:
    depends_on: []
    implements:
    - mod_utils
- id: atom_lig_checks
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/utils/xyz2mol.py
  description: "Validates ligand connectivity after adjacency matrix \u2192 Mol conversion.\
    \ Checks for disconnected fragments, unexpected valences, and known failure modes.\
    \ Guards entry into the OIN encoding path.\n"
  inputs:
  - data_type: RDKit Mol, ligand fragments
    source_id: atom_get_tmc_mol
  outputs:
  - data_type: validation result (bool or raises)
    target_id: atom_get_tmc_mol
  edges:
    depends_on: []
    implements:
    - mod_utils
- id: atom_get_proposed_ligand_charge
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/utils/xyz2mol.py
  description: 'Estimates charge for a ligand fragment using oxidation state heuristics
    from the ALLOWED_OXIDATION_STATES constant. Used in charge-aware adjacency matrix
    generation.

    '
  inputs:
  - data_type: atom symbols, connectivity
    source_id: atom_get_tmc_mol
  outputs:
  - data_type: estimated charge (int)
    target_id: atom_get_tmc_mol
  edges:
    depends_on: []
    implements:
    - mod_utils
- id: atom_fix_NO2
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/utils/xyz2mol.py
  description: 'Post-processing fix for NO2 groups that xyz2mol misassigns due to
    resonance structure ambiguity. Corrects bond orders in RDKit Mol before OIN encoding.

    '
  inputs:
  - data_type: RDKit Mol
    source_id: atom_get_tmc_mol
  outputs:
  - data_type: corrected RDKit Mol
    target_id: atom_get_tmc_mol
  edges:
    depends_on: []
    implements:
    - mod_utils
- id: atom_shell
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/utils/xyz2mol.py
  description: 'Utility: runs a shell command and returns stdout. Used internally
    for OpenBabel subprocess calls in the xyz2AC_obabel fallback path.

    '
  inputs:
  - data_type: command string
    source_id: atom_xyz2AC_obabel
  outputs:
  - data_type: stdout string
    target_id: atom_xyz2AC_obabel
  edges:
    depends_on: []
    implements:
    - mod_utils
- id: atom__align_to_pai
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/utils/xyz2mol.py
  description: 'Private helper: aligns coordinates to principal axes of inertia. Used
    in geometry pre-processing before RMSD fitting in OINDiscreteAligner.

    '
  inputs:
  - data_type: xyz_coords array
    source_id: atom_OINDiscreteAligner
  outputs:
  - data_type: rotated xyz_coords array
    target_id: atom_OINDiscreteAligner
  edges:
    depends_on: []
    implements:
    - mod_utils
- id: atom_OINSanitizer
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/utils/oin_aligner.py
  description: "Enforces Zone A (metal-binding atoms) SMILES bracketing. generate_robust_smiles()\
    \ rewrites the ligand SMILES so all Zone A atoms have explicit H counts in brackets\
    \ (e.g., N \u2192 [NH3], c \u2192 [cH]). Mandatory pre-condition for OIN encoding.\n"
  inputs:
  - data_type: RDKit Mol, metal neighbor indices
    source_id: atom_get_tmc_mol
  outputs:
  - data_type: sanitized SMILES string
    target_id: atom_get_tmc_mol
  edges:
    depends_on: []
    implements:
    - mod_utils
- id: atom_OINDiscreteAligner
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/utils/oin_aligner.py
  description: "Core OIN encoding engine. Performs: haptic reduction (Zone-A atom\
    \ groups \u2192 virtual centroids), competitive geometry detection (RMSD fit against\
    \ LIN/TPL/SPL/TET/TPY/ TBP/SPY/OCT/PBP via Rotation.align_vectors), template slot\
    \ mapping, symmetry permutation + maximization (discrete 0/90/120/180/240/270\xB0\
    \ rotations), homogeneous sorting (identical ligands), heading atom selection\
    \ (V3.4), winding direction (cross-product sign, V3.6). Contains TEMPLATE_SPECS,\
    \ TEMPLATES (TD-005 duplicate), SYMMETRIC_LIGANDS (TD-006 hard-coded set).\n"
  inputs:
  - data_type: RDKit Mol, xyz_coords, metal fragment SMILES
    source_id: atom_get_oin_string
  outputs:
  - data_type: OIN slot assignment string (V2.4 sidecar intermediate)
    target_id: atom_get_oin_string
  edges:
    depends_on: []
    implements:
    - mod_utils
- id: atom_AC2mol
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/utils/xyz2mol_local.py
  description: "Jensen Group algorithm: converts adjacency matrix (AC) + atom types\
    \ to RDKit Mol with correct bond orders. Core of the xyz\u2192mol connectivity\
    \ inference.\n"
  inputs:
  - data_type: adjacency matrix, atom types, charge
    source_id: atom_get_basic_mol
  outputs:
  - data_type: RDKit Mol
    target_id: atom_get_basic_mol
  edges:
    depends_on: []
    implements:
    - mod_utils
- id: atom_read_xyz_file
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/utils/xyz2mol_local.py
  description: 'Reads an XYZ file and returns (atom_symbols: List[str], coordinates:
    ndarray). Entry point for raw structure ingestion.

    '
  inputs:
  - data_type: XYZ file path
    source_id: atom_get_tmc_mol
  outputs:
  - data_type: tuple(List[str], ndarray)
    target_id: atom_get_tmc_mol
  edges:
    depends_on: []
    implements:
    - mod_utils
- id: atom_xyz2AC_huckel
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/utils/xyz2mol_local.py
  description: "Primary adjacency matrix generator. Uses H\xFCckel-theory / distance-based\
    \ bonding heuristics to infer connectivity from 3D coordinates + covalent radii\
    \ (mendeleev).\n"
  inputs:
  - data_type: atom_symbols, coords, charge
    source_id: atom_get_tmc_mol
