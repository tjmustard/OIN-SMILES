  - data_type: tuple(smiles_str, geo_code, List[Tuple[rank,atom_idx,slot]])
    target_id: atom_OINParser_gen
  edges:
    depends_on: []
    implements:
    - mod_oin
- id: atom_OIN3DGenerator
