- id: atom_OINWriter
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/oin/writer.py
  description: 'V1.x sidecar format OIN writer. write() builds OIN string with |w:|d:|m:|g:|
    tags. Not used in the active pipeline (V3.0 inline is the canonical output). Instantiated
    by XYZToSMILES.__init__() but never called.

    '
  inputs:
  - data_type: smiles, coords, bonds, geometry_label
    source_id: atom_XYZToSMILES
  outputs:
  - data_type: V1.x OIN string
    target_id: atom_XYZToSMILES
