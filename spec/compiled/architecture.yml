- id: generation.molassembler_adapter.haptic_face_correction
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/generation/molassembler_adapter.py
  description: 'Stereo Phase 3: within _stitch_eta_fragment/_stitch_multi_eta_fragment,
    measures placed eta-ring circulation via oin.winding.signed_circulation and applies
    a proper (det+1) 180-degree in-plane rotation when it disagrees with the input
    OINVector.winding marker; records a structured fired/skipped/conflict/no-op decision
    per ring on GeneratedStructure.haptic_face_decisions instead of stderr prints.
    Bridged multi-eta fragments get a coherent whole-fragment correction only when
    both rings agree; disagreement is left unchanged and logged as conflict.'
  inputs:
  - data_type: oin_vector_winding
    source_id: atom_oin_parser_gen
  - data_type: placed_ring_coords
    source_id: atom_molassembler_adapter
  outputs:
  - data_type: corrected_ring_coords
    target_id: atom_molassembler_adapter
  - data_type: decision_signal
    target_id: atom_generated_structure
  edges:
    depends_on:
    - oin.winding.signed_circulation
    implements: []
- id: atom_molassembler_adapter
  dimension: Atomic
  status: clean
  associated_file: src/oinsmiles/generation/molassembler_adapter.py
  description: "MolassemblerAdapter: Template-based 3D placement for known geometries;\
    \ DG + ETKDG fallback for aromatic \u03B7-ligands; Stereo Phase 3: eta-ring ETKDG\
    \ embedding gained an anionic-ring fallback (Attempt 1b) for substituted rings\
    \ that fail plain kekulization, and haptic-face correction (see generation.molassembler_adapter.haptic_face_correction)\
    \ after placement; final post-optimisation collision threshold loosened 1.60->1.45\
    \ \xC5 (monotonic, byte-identical for all previously-passing placements); Stereo\
    \ Phase 4 MiniPRD-B: _verify_zone_a_p checks the assembled complex's Zone-A P labels\
    \ (dummy-metal copy + rdCIPLabeler, reusing core/chirality.py helpers) against the\
    \ input [P@]/[P@@] tag and re-embeds the offending fragment with a new seed (\u2264\
    3 attempts, never a mirror/improper transform); persistent mismatch or a\
    \ no-assembled-mol fallback path (eta/DG) emits the structure anyway with an\
    \ OINStereoWarning. Stereo Phase 4 MiniPRD-C (dummy-metal embed, fixes the SPL\
    \ one-sided-enforcement bug): _stitch_fragment attaches a Z=0 dummy (via\
    \ core.chirality._attach_dummy_metal) as the 4th substituent on every Zone-A-P\
    \ atom of any denticity before AddHs/ETKDG, asserts a pre-placement lone-pair-CIP\
    \ parity guard against the mol's own live chiral tag, orients the fragment by the\
    \ embedded P\u2192dummy vector(s) (monodentate: single-vector rotation plus a\
    \ residual-DOF clash sweep via _sweep_rotation_for_clash_avoidance; bidentate:\
    \ bite-axis angle sweep maximising P\u2192dummy/slot alignment via\
    \ _dummy_alignment_score), then strips every dummy (_strip_dummy_atoms) before\
    \ returning, with a hard postcondition assert (no Z=0 atom, stable atom count) at\
    \ every _stitch_fragment return point. The assembled-complex re-embed loop also\
    \ retries on post-placement inter-fragment clashes (_zone_a_p_clash_offending_frags),\
    \ not just stereo mismatches. The Molassembler DG fallback path (incompatible-bite\
    \ bidentates, routed here by the ee0b3f0 bite-distortion guard) gains Zone-A-P\
    \ enforcement via a bounded 3-attempt reseed loop and a set-based label comparison\
    \ (_zone_a_p_measured_labels_dg, since _build_connected_smiles canonicalises indices\
    \ away), superseding the old unconditional _warn_zone_a_p_fallback call on that path."
  inputs:
  - data_type: parsed_oin
    source_id: atom_oin_parser_gen
  outputs:
  - data_type: xyz_positions
    target_id: atom_oin3d_generator
  - data_type: rdkit_mol
    target_id: atom_oin3d_generator
  edges:
    depends_on:
    - generation.molassembler_adapter.haptic_face_correction
    implements: []
