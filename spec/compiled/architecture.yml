  status: dirty
  associated_file: src/oinsmiles/generation/oin_parser.py
  description: 'Vector-resolving OIN parser for 3D generation. parse() returns ParsedOIN
    dataclass with resolved 3D unit vectors from TEMPLATES. Handles inline and sidecar
    formats. Contains TEMPLATES constant dict (TD-005: duplicate of oin_aligner.py).
    Also defines OINVector and ParsedOIN dataclasses.

    '
  inputs:
  - data_type: OIN-SMILES string
    source_id: atom_OIN3DGenerator
  outputs:
  - data_type: ParsedOIN dataclass
    target_id: atom_OIN3DGenerator
  edges:
    depends_on:
    - atom_OINInlineHandler
    implements:
    - mod_generation
