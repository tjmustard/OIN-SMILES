name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync (includes dev tooling)
        run: uv sync
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # Light install — the default (no torch / mace-torch). The MACE and g-xTB
      # tests skip automatically when their optional deps / binaries are absent.
      - name: Sync (light install)
        run: uv sync
      - name: Unit tests
        run: uv run python -m unittest discover tests/unit
      - name: Encoder round-trip (XYZ -> OIN, 27 cases)
        run: uv run python tests/integration/verify_xyz_to_oin.py
